<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Todo App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    #new-todo { flex: 1; padding: 8px; font-size: 14px; }
    button { padding: 8px 12px; font-size: 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
    li.done .title { text-decoration: line-through; color: #888; }
    #count { color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Demo Todo App</h1>
  <div class="row">
    <input id="new-todo" type="text" placeholder="What needs doing?" aria-label="New todo" />
    <button id="add-btn">Add</button>
  </div>
  <ul id="todo-list" aria-label="Todo list"></ul>
  <p id="count">0 remaining</p>
  <script src="./app.js"></script>
</body>
</html>
